name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    if: "${{ github.event_name != 'push' || github.event.head_commit.message != 'chore: keep workflows active' }}"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen --all-groups

    - name: Run unit tests
      run: |
        uv run --frozen python -m unittest discover tests 2>&1 | tee unit-test.log

    - name: Upload CI artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: ci-logs
        path: unit-test.log
        retention-days: 1
        if-no-files-found: ignore
