name: Test Telegram Report

on:
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to send (KR/US)'
        required: true
        default: 'KR'
        type: choice
        options:
          - KR
          - US

jobs:
  send-test-report:
    runs-on: ubuntu-latest
    env:
      REPORT_FORMAT_CONFIG: config/report_formats.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --frozen --all-groups

    - name: Run Telegram report test
      run: |
        uv run --frozen python src/main.py --market ${{ inputs.market }} 2>&1 | tee macro-pulse.log

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: telegram-test-${{ inputs.market }}
        path: |
          macro_pulse_report.html
          macro-pulse.log
        retention-days: 1
        if-no-files-found: ignore

    - name: Send failure notification
      if: failure() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      run: |
        curl --silent --show-error --fail \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=Macro Pulse manual Telegram test failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
